# Linux-host deployment: rooted Android 14 in a container + ws-scrcpy + dashboard.
#
# Backend (3000) and ws-scrcpy (8000) publish on the host so an external
# reverse proxy (Synology DSM, nginx, Traefik, etc.) can front them with TLS
# and auth. There is no built-in edge layer — bind the host ports to
# 127.0.0.1 in .env if the host should not expose them directly.
#
# Host requirements:
#   - Linux kernel with binder_linux + ashmem_linux modules
#     (install redroid-modules DKMS, see github.com/remote-android/redroid-doc)
#   - Docker engine + compose plugin
#
# After `docker compose up`:
#   - redroid     adb-reachable at  redroid:5555  (published to host:5555)
#   - dashboard   http://<host>:3000
#   - ws-scrcpy   http://<host>:8000

services:
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:14.0.0_64only-latest}
    container_name: headless-redroid
    privileged: true
    ports:
      - "5555:5555"
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_fps=${REDROID_FPS:-60}
      - androidboot.redroid_height=${REDROID_HEIGHT:-1920}
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
    volumes:
      - redroid-data:/data
    restart: unless-stopped
    networks:
      - hl

  ws-scrcpy:
    build:
      context: ..
      dockerfile: docker/ws-scrcpy.Dockerfile
    container_name: headless-ws-scrcpy
    depends_on:
      - redroid
    ports:
      - "${WS_SCRCPY_HOST_PORT:-8000}:8000"
    environment:
      WS_SCRCPY_HOSTNAME: 0.0.0.0
      WS_SCRCPY_PORT: 8000
    networks:
      - hl
    # ws-scrcpy needs adb to reach redroid:5555.
    # Its entrypoint runs `adb connect redroid:5555` before npm start.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: headless-backend
    depends_on:
      - redroid
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_TYPE: redroid
      ADB_SERIAL: redroid:5555
      # Default points at ws-scrcpy on the same host. The literal 'localhost'
      # is rewritten to the requested hostname at /api/config so the iframe
      # works whether you hit the dashboard via localhost, LAN IP, or a
      # reverse-proxied hostname.
      WS_SCRCPY_URL: http://localhost:${WS_SCRCPY_HOST_PORT:-8000}
    networks:
      - hl
    restart: unless-stopped
    # 200 only if adb is connected, Magisk daemon is up, lspd is running,
    # and our module is enabled. See backend/routes/health.js.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Edge-triggered health monitor. Polls /api/health on the backend; on a
  # state transition (ok->failed or failed->ok) POSTs to MONITOR_WEBHOOK_URL.
  # Compatible with Slack/Discord/Synology Webhook payloads.
  # Disabled by default — only starts if MONITOR_WEBHOOK_URL is set in .env.
  monitor:
    profiles: ["monitor"]
    build:
      context: ./monitor
    container_name: headless-monitor
    depends_on:
      - backend
    environment:
      HEALTH_URL: ${MONITOR_HEALTH_URL:-http://backend:3000/api/health}
      WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:?set MONITOR_WEBHOOK_URL in .env or skip the monitor profile}
      POLL_INTERVAL: ${MONITOR_POLL_INTERVAL:-30}
      FAIL_THRESHOLD: ${MONITOR_FAIL_THRESHOLD:-3}
      INSTANCE_NAME: ${MONITOR_INSTANCE_NAME:-headless}
    restart: unless-stopped
    networks:
      - hl

volumes:
  redroid-data:

networks:
  hl:
