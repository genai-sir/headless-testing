# Linux-host deployment: rooted Android 14 in a container + ws-scrcpy + dashboard.
#
# Host requirements:
#   - Linux kernel with binder_linux + ashmem_linux modules
#     (install redroid-modules DKMS, see github.com/remote-android/redroid-doc)
#   - Docker engine + compose plugin
#
# After `docker compose up`:
#   - redroid     adb-reachable at  redroid:5555  (also published to host:5555)
#   - ws-scrcpy   http://<host>:8000
#   - dashboard   http://<host>:3000
#   - mitmproxy   proxy at mitmproxy:8080 inside the hl network (redroid points here)
#                 web UI + flow API at http://<host>:8081 (also iframed by the dashboard)

services:
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:14.0.0_64only-latest}
    container_name: headless-redroid
    privileged: true
    ports:
      - "5555:5555"
      # mitmweb UI. The mitmproxy container joins this redroid container's
      # network namespace (see below) so that mitmweb actually listens on
      # *this* container's interfaces; docker can only port-publish from the
      # container that owns the netns, hence the mapping lives here.
      - "${MITM_WEB_HOST_PORT:-8081}:8081"
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_fps=${REDROID_FPS:-60}
      - androidboot.redroid_height=${REDROID_HEIGHT:-1920}
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
    volumes:
      - redroid-data:/data
    restart: unless-stopped
    networks:
      - hl

  ws-scrcpy:
    build:
      context: ..
      dockerfile: docker/ws-scrcpy.Dockerfile
    container_name: headless-ws-scrcpy
    depends_on:
      - redroid
    ports:
      - "${WS_SCRCPY_HOST_PORT:-8000}:8000"
    environment:
      WS_SCRCPY_HOSTNAME: 0.0.0.0
      WS_SCRCPY_PORT: 8000
    networks:
      - hl
    # ws-scrcpy needs adb to reach redroid:5555.
    # Its entrypoint runs `adb connect redroid:5555` before npm start.
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: headless-backend
    depends_on:
      - redroid
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_TYPE: redroid
      ADB_SERIAL: redroid:5555
      WS_SCRCPY_URL: http://localhost:${WS_SCRCPY_HOST_PORT:-8000}
      # mitmproxy lives in redroid's network namespace, so from the backend
      # container we reach mitmweb via the redroid service hostname.
      MITM_API_URL: http://redroid:8081
      MITM_WEB_PASSWORD: ${MITM_WEB_PASSWORD:-headless-mitm}
    networks:
      - hl
    restart: unless-stopped

  # Transparent traffic tap for redroid. This container *joins* the redroid
  # container's network namespace (network_mode: service:redroid) so that:
  #
  #   1. iptables OUTPUT rules installed by our entrypoint actually catch
  #      traffic emitted by Android apps inside redroid.
  #   2. mitmproxy's transparent mode (which depends on SO_ORIGINAL_DST being
  #      preserved by REDIRECT in the same kernel netns) can recover the
  #      original destination host.
  #
  # Because this container has no network of its own, its listening sockets
  # (8080 transparent proxy, 8081 web UI) are exposed via redroid's port
  # mapping above.
  #
  # To actually decrypt HTTPS, redroid must trust the mitmproxy CA cert as a
  # system cert. scripts/install-mitm-ca.sh installs it as a Magisk module.
  mitmproxy:
    build:
      context: ..
      dockerfile: docker/mitmproxy.Dockerfile
    container_name: headless-mitmproxy
    depends_on:
      - redroid
    network_mode: "service:redroid"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      MITM_WEB_PASSWORD: ${MITM_WEB_PASSWORD:-headless-mitm}
    volumes:
      - mitmproxy-data:/home/mitmproxy/.mitmproxy
    restart: unless-stopped

volumes:
  redroid-data:
  mitmproxy-data:

networks:
  hl:
