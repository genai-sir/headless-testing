# Linux-host deployment: rooted Android 14 in a container + ws-scrcpy + dashboard.
#
# Host requirements:
#   - Linux kernel with binder_linux + ashmem_linux modules
#     (install redroid-modules DKMS, see github.com/remote-android/redroid-doc)
#   - Docker engine + compose plugin
#
# After `docker compose up`:
#   - redroid     adb-reachable at  redroid:5555  (also published to host:5555)
#   - ws-scrcpy   http://<host>:8000
#   - dashboard   http://<host>:3000
#   - mitmproxy   web UI + flow API at http://<host>:8081 (iframed by dashboard).
#                 The traffic tap runs in the host netns: iptables PREROUTING
#                 on the docker bridge for redroid catches outbound :80/:443
#                 and redirects to mitmproxy's transparent listener on :8080.

services:
  redroid:
    image: ${REDROID_IMAGE:-redroid/redroid:14.0.0_64only-latest}
    container_name: headless-redroid
    privileged: true
    ports:
      - "5555:5555"
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_fps=${REDROID_FPS:-60}
      - androidboot.redroid_height=${REDROID_HEIGHT:-1920}
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
    volumes:
      - redroid-data:/data
    restart: unless-stopped
    networks:
      - hl

  ws-scrcpy:
    build:
      context: ..
      dockerfile: docker/ws-scrcpy.Dockerfile
    container_name: headless-ws-scrcpy
    depends_on:
      - redroid
    ports:
      - "${WS_SCRCPY_HOST_PORT:-8000}:8000"
    environment:
      WS_SCRCPY_HOSTNAME: 0.0.0.0
      WS_SCRCPY_PORT: 8000
    networks:
      - hl
    # ws-scrcpy needs adb to reach redroid:5555.
    # Its entrypoint runs `adb connect redroid:5555` before npm start.
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: headless-backend
    depends_on:
      - redroid
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BACKEND_TYPE: redroid
      ADB_SERIAL: redroid:5555
      WS_SCRCPY_URL: http://localhost:${WS_SCRCPY_HOST_PORT:-8000}
      # mitmproxy now runs in the host's network namespace (so iptables on the
      # docker bridge can catch redroid's traffic with SO_ORIGINAL_DST intact).
      # From inside this container, the host is reachable via host.docker.internal
      # — see extra_hosts below.
      MITM_API_URL: http://host.docker.internal:${MITM_WEB_HOST_PORT:-8081}
      MITM_WEB_PASSWORD: ${MITM_WEB_PASSWORD:-headless-mitm}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hl
    restart: unless-stopped

  # Transparent traffic tap for redroid. Earlier iterations placed mitmproxy
  # *inside* redroid's network namespace, but Android's `netd` / fwmark-based
  # routing intercepts iptables OUTPUT rules unpredictably and most
  # post-REDIRECT packets never reached mitmproxy. We now run mitmproxy in
  # the HOST netns (`network_mode: host`) and install iptables PREROUTING
  # rules on the docker bridge — so packets emitted by redroid hit our
  # rules in the host kernel (where SO_ORIGINAL_DST is preserved) before
  # they even touch the wider host network.
  #
  # The entrypoint discovers redroid's docker bridge interface from
  # REDROID_NETWORK and installs the PREROUTING REDIRECT for ports 80/443.
  # Ports 8080 (transparent proxy), 8081 (web UI), 9050 (SOCKS5 — kept for
  # future PCAPdroid-style chaining) bind on all host interfaces; backend
  # reaches them via host.docker.internal.
  #
  # To actually decrypt HTTPS, redroid must trust the mitmproxy CA cert as a
  # system cert. scripts/install-mitm-ca.sh installs it as a Magisk module.
  mitmproxy:
    build:
      context: ..
      dockerfile: docker/mitmproxy.Dockerfile
    container_name: headless-mitmproxy
    depends_on:
      - redroid
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Each intercepted flow holds 2+ sockets (client + server, sometimes
    # plus TLS upstreams). Default container nofile=1024 runs out fast under
    # browser traffic; we saw Errno 24 ("too many open files") on the
    # accept(2) path after ~1000 attempted connections.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      MITM_WEB_PASSWORD: ${MITM_WEB_PASSWORD:-headless-mitm}
      # Docker-compose project name + network -> bridge interface name.
      # Default project name is the compose dir; users can override via
      # `name: headless-android` in compose. We pass the docker network
      # NAME and let the entrypoint resolve it to a bridge interface via
      # `ip link show master ...` heuristics.
      REDROID_NETWORK: ${REDROID_NETWORK:-docker_hl}
    volumes:
      - mitmproxy-data:/home/mitmproxy/.mitmproxy
    restart: unless-stopped

volumes:
  redroid-data:
  mitmproxy-data:

networks:
  hl:
